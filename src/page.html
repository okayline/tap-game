<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UN/CLICK</title>
<style>
  /* themed like aura-farm ("Aura glow"): near-black with purple light, Impact headings, glowing text, gradient buttons */
  :root {
    --bg: #0b0a12; --panel: #171226; --panel2: #1b1530; --line: #3a2f5c;
    --ink: #f4f1ff; --mute: #c9b8ff; --dim: #a99ccf;
    --D: #5ad1ff; --H: #ff6fcf; --S: #b084ff;
    --meme: Impact, "Arial Black", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }   /* the page itself never scrolls */
  body { min-height: 100vh; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(circle at 50% 0%, #2a1650 0%, var(--bg) 60%) fixed, var(--bg); }
  /* a button is shown 2x (176x62), or smaller on a narrow screen so three fit across */
  :root { --w: min(176px, calc((100vw - 92px) / 3)); }
  #game { max-width: 620px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-family: var(--meme); font-size: 26px; letter-spacing: .5px; text-transform: uppercase; margin: 0;
       text-shadow: 0 0 8px rgba(176,132,255,.6), 0 0 16px rgba(255,111,207,.3); }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .side > div:first-child { font-family: var(--meme); font-size: 18px; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(176,132,255,.75); }
  .row { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; margin-top: 8px; }
  .btn { position: relative; width: var(--w); height: var(--w); display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; border-radius: 10px; color: var(--ink); }
  /* untapped (ready, hits back): lies flat, in full colour, with a glow behind it; tapped (cooling down): stands up sideways, starts
     grey and fills back up with colour as its cooldown runs out (the page sets its filter as it counts down) */
  .btn img { width: var(--w); height: calc(var(--w) * 31 / 88); image-rendering: pixelated; transition: transform .2s; filter: drop-shadow(0 0 8px rgba(255,111,207,.8)); }
  .btn.tapped img { transform: rotate(90deg); }
  .btn.can { cursor: pointer; outline: 2px dashed var(--S); outline-offset: 2px; }
  .btn.sel { outline: 2px solid var(--H); box-shadow: 0 0 16px rgba(255,111,207,.6); }
  .btn.att { outline: 2px solid var(--D); box-shadow: 0 0 16px rgba(90,209,255,.6); }
  /* a knocked-out button: dimmed, crossed out, no numbers (on the field until replaced, then in the deck row) */
  .out img, .gone img { opacity: .3; }
  .btn.out img { filter: grayscale(1); }
  .btn.out::before, .btn.out::after, .card.gone::before, .card.gone::after { content: ""; position: absolute; left: 50%; top: 50%; width: 55%; height: 8px;
               border-radius: 4px; background: var(--H); box-shadow: 0 0 6px var(--H); transform: translate(-50%, -50%) rotate(19deg); pointer-events: none; }
  .card.gone::before, .card.gone::after { height: 4px; border-radius: 2px; }
  .btn.out::after, .card.gone::after { transform: translate(-50%, -50%) rotate(-19deg); }
  /* power/life left in the button's bottom-right corner (a soft glow), and damage being placed on it in the top-right */
  /* seconds until a tapped button untaps, in the top-right */
  .pt, .dmg { position: absolute; font-family: var(--meme); letter-spacing: .5px; line-height: 1; pointer-events: none; }
  .pt { right: 8px; bottom: 6px; font-size: calc(var(--w) * .1); color: var(--ink); text-shadow: 0 0 4px rgba(176,132,255,.45); }
  .dmg { right: 8px; top: 6px; font-size: calc(var(--w) * .14); color: var(--H); text-shadow: 0 0 8px var(--H); }
  .bar { text-align: center; }
  /* your status line, at the top of your panel: this turn, then (smaller, at the right) only the end of the match, an error or a disconnect; one line, cut with … if too long */
  .statusline { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 700 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-transform: none; letter-spacing: 0; text-align: right; color: var(--mute); text-shadow: 0 0 10px rgba(176,132,255,.75); }
  button.act { width: 100%; height: 54px; border-radius: 14px; border: 0; cursor: pointer; color: var(--ink);
               background: linear-gradient(135deg, #b084ff, #ff6fcf); font-family: var(--meme); font-size: 19px; letter-spacing: .5px;
               text-transform: uppercase; text-shadow: 0 0 6px rgba(255,255,255,.35); box-shadow: 0 0 22px rgba(255,111,207,.45); }
  /* the log: the 5 newest lines, newest at the top; new lines appear one at a time (LINE_MS apart) */
  button.act:disabled { cursor: default; filter: grayscale(1); opacity: .4; box-shadow: none; }
  #log { white-space: pre-wrap; font-size: 15px; line-height: 1.5; min-height: calc(5 * 1.5em + 20px); overflow: hidden; background: var(--panel); border: 1px solid var(--line);
         border-radius: 14px; padding: 10px 12px; color: var(--dim); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .err { color: #ffb3b3; }
  /* the deck: the buttons still to come in, half size, next one on the left; before the first attack, drag one of yours onto a field button to swap them */
  /* 6 across, as wide as the field row (3 buttons and 2 gaps of 12px) with 5 gaps of 8px; power/toughness in the corner */
  :root { --dw: calc((var(--w) * 3 - 16px) / 6); }
  .deck { display: flex; gap: 8px; margin-top: 10px; min-height: calc(var(--dw) * 31 / 88); }
  .deck .card { position: relative; }
  /* the ones still in the deck are lit up (full colour); knocked-out ones stay greyed */
  .deck .card:not(.gone) img { filter: none; }
  .deck img { display: block; width: var(--dw); height: calc(var(--dw) * 31 / 88); image-rendering: pixelated; filter: grayscale(1) brightness(.6); }
  .deck .card.drag { cursor: grab; outline: 1px dashed var(--S); outline-offset: 2px; touch-action: none; }
  .deck .dpt { position: absolute; right: 2px; bottom: 1px; font-family: var(--meme); font-size: 11px; line-height: 1; color: var(--ink);
               text-shadow: 0 0 3px #000, 0 0 4px rgba(176,132,255,.6); pointer-events: none; }
  .ghost { position: fixed; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; z-index: 9; width: var(--dw); image-rendering: pixelated; filter: grayscale(1) brightness(.6); }
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
</style>
</head>
<body>
<div id="game">
<h1>UN/CLICK</h1>
  <div class="side"><div id="themHp"></div><div class="row" id="them"></div><div class="deck" id="themDeck"></div></div>
  <div class="bar"><button class="act" id="start" hidden>start</button> <button class="act" id="hint" disabled hidden></button> <button class="act" id="again" hidden>new match</button></div>
  <div class="side"><div class="statusline"><span id="meHp"></span><span id="status"><span id="result"></span> <span id="err" class="err"></span></span></div><div class="row" id="me"></div><div class="deck" id="meDeck"></div></div>
  <div id="log"></div>
  <!-- the footer every game shows (dungeon-items src/footer.js), with this game's version: raise data-version every version; data-copy="no" leaves out the 🄯 (the buttons include remixes of other people's art, uncredited here) -->
  <div id="ddfoot"></div>
</div>
<script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.42" data-copy="no"></script>
<script>
const $ = (id) => document.getElementById(id);
{
  // Real time: tap one of your untapped buttons, then one of theirs, to hit it. Times come from the server's clock (skew).
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname}/ws`);
  let g = null, skew = 0, sel = null, timer = null;
  const now = () => Date.now() + skew;
  const send = (o) => ws.send(JSON.stringify(o));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error) { $("err").textContent = d.error; return; }
    g = d.g; skew = d.now - Date.now(); $("err").textContent = "";
    if (sel !== null && (!g.sides.a.buttons[sel] || g.sides.a.buttons[sel].out)) sel = null;
    draw();
    clearInterval(timer);
    if (g.started && !g.winner) timer = setInterval(tick, 100); // cooldowns count down between messages
  };
  ws.onclose = () => { $("err").textContent = "disconnected: reload"; clearInterval(timer); };
  $("start").onclick = () => send({ do: "start" });
  $("again").onclick = () => location.assign("/"); // the main page starts a new match

  // every 100ms: count the seconds down in place, and redraw only when a button untaps (redrawing every tick would eat taps)
  let readySig = "";
  const sig = () => [...g.sides.a.buttons, ...g.sides.b.buttons].map((b) => (!b.out && b.readyAt <= now() ? 1 : 0)).join("");
  function tick() {
    if (sig() !== readySig) return draw();
    for (const d of document.querySelectorAll(".dmg[data-at]")) d.textContent = Math.max(0, (d.dataset.at - now()) / 1000).toFixed(1);
    for (const i of document.querySelectorAll("img[data-at]")) i.style.filter = grey(i.dataset.at - now(), Number(i.dataset.cd));
  }
  function draw() {
    if (!g.rt) { $("err").textContent = "this match is from the turn-based version"; $("again").hidden = false; return; }
    const t = now(), mine = g.sides.a.buttons, theirs = g.sides.b.buttons;
    readySig = sig();
    const ready = (b) => !b.out && b.readyAt <= t;
    const on = g.started && !g.winner;
    if (sel !== null && !ready(mine[sel])) sel = null;
    // yours: tap an untapped one to pick it (tap again to drop it)
    row($("me"), mine, (b, i) => (on && ready(b) ? { can: true, sel: sel === i, click: () => { sel = sel === i ? null : i; draw(); } } : {}), t);
    // theirs: with one of yours picked, tap one of theirs to hit it
    row($("them"), theirs, (b, i) => (on && sel !== null && !b.out ? { can: true, click: () => { send({ do: "hit", i: sel, t: i }); sel = null; draw(); } } : {}), t);
    const fill = (g.sides.a.deck ?? []).length > 0 && mine.some((b) => b.out);
    deckRow($("meDeck"), g.sides.a, !g.winner && (!g.started || fill));
    deckRow($("themDeck"), g.sides.b, false);
    $("meHp").textContent = "you";
    $("themHp").textContent = "dummy";
    $("result").textContent = g.winner ? (g.winner === "draw" ? "draw" : g.winner === "a" ? "you win" : "you lose") : "";
    $("start").hidden = !!g.started || !!g.winner;
    $("again").hidden = !g.winner;
    $("hint").hidden = !on;
    $("hint").textContent = fill && mine.every((b) => b.out) ? "bring in a button" : sel === null ? "tap one of yours" : "now tap one of theirs";
    $("log").textContent = g.log.slice(-5).reverse().join("\n");
  }
  // a side's deck row: its deck (next on the left; power/life left), then its knocked-out buttons, crossed out
  function deckRow(el, side, can) {
    el.innerHTML = "";
    (side.deck ?? []).forEach((b, j) => {
      const card = document.createElement("div"); card.className = "card"; card.title = `${b.name} ${b.power}/${b.toughness - b.damage}`;
      const img = document.createElement("img"); img.alt = ""; img.src = b.image;
      const pt = document.createElement("span"); pt.className = "dpt"; pt.textContent = `${b.power}/${b.toughness - b.damage}`;
      card.append(img, pt);
      if (can) { card.classList.add("drag"); card.onpointerdown = (e) => drag(e, j, img); }
      el.append(card);
    });
    (side.gone ?? []).forEach((b) => {
      const card = document.createElement("div"); card.className = "card gone"; card.title = `${b.name} (out)`;
      const img = document.createElement("img"); img.alt = ""; img.src = b.image;
      card.append(img); el.append(card);
    });
  }
  // drag a deck picture (mouse or touch) and drop it on one of your field buttons: before the start to swap, after it onto a knocked-out one
  function drag(e, j, img) {
    e.preventDefault();
    const ghost = img.cloneNode(); ghost.className = "ghost"; document.body.append(ghost);
    const at = (ev) => { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; };
    const end = (ev) => {
      ghost.remove();
      removeEventListener("pointermove", at); removeEventListener("pointerup", end); removeEventListener("pointercancel", end);
      const t = ev.type === "pointerup" && document.elementFromPoint(ev.clientX, ev.clientY)?.closest("#me .btn");
      if (t) send({ do: "swap", i: Number(t.dataset.i), j });
    };
    at(e);
    addEventListener("pointermove", at); addEventListener("pointerup", end); addEventListener("pointercancel", end);
  }
  // how grey a tapped button is: all grey when it has just tapped, back to full colour as its cooldown runs out
  const grey = (left, cd) => { const f = Math.max(0, Math.min(1, left / cd)); return `grayscale(${f}) brightness(${1 - 0.4 * f})`; };
  // untapped: flat, in colour, glowing; tapped: sideways, filling back up with colour, with the seconds left until it untaps
  function row(el, buttons, how, t) {
    el.innerHTML = "";
    buttons.forEach((b, i) => {
      const h = how(b, i), left = b.out ? 0 : b.readyAt - t;
      const btn = document.createElement("button");
      btn.className = "btn" + (b.out ? " out" : "") + (left > 0 ? " tapped" : "") + (h.can ? " can" : "") + (h.sel ? " sel" : "");
      const img = document.createElement("img"); img.alt = ""; img.src = b.image; btn.append(img);
      if (left > 0) { img.dataset.at = b.readyAt; img.dataset.cd = b.cooldown; img.style.filter = grey(left, b.cooldown); }
      if (h.click) btn.onclick = h.click;
      const pt = document.createElement("span"); pt.className = "pt"; pt.textContent = b.out ? "" : `${b.power}/${b.toughness - b.damage}`;
      btn.append(pt);
      if (left > 0) { const d = document.createElement("span"); d.className = "dmg"; d.dataset.at = b.readyAt; d.textContent = (left / 1000).toFixed(1); btn.append(d); }
      btn.title = b.name;
      btn.dataset.i = i;
      el.append(btn);
    });
  }
}
</script>
</body>
</html>
