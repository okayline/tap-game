<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UN/CLICK</title>
<style>
  /* themed like aura-farm ("Aura glow"): near-black with purple light, Impact headings, glowing text, gradient buttons */
  :root {
    --bg: #0b0a12; --panel: #171226; --panel2: #1b1530; --line: #3a2f5c;
    --ink: #f4f1ff; --mute: #c9b8ff; --dim: #a99ccf;
    --D: #5ad1ff; --H: #ff6fcf; --S: #b084ff;
    --meme: Impact, "Arial Black", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }   /* the page itself never scrolls */
  body { min-height: 100vh; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(circle at 50% 0%, #2a1650 0%, var(--bg) 60%) fixed, var(--bg); }
  /* a button is shown 2x (176x62), or smaller on a narrow screen so three fit across */
  :root { --w: min(176px, calc((100vw - 92px) / 3)); }
  #game { max-width: 620px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-family: var(--meme); font-size: 26px; letter-spacing: .5px; text-transform: uppercase; margin: 0;
       text-shadow: 0 0 8px rgba(176,132,255,.6), 0 0 16px rgba(255,111,207,.3); }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .side > div:first-child { font-family: var(--meme); font-size: 18px; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(176,132,255,.75); }
  .row { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; margin-top: 8px; }
  .btn { position: relative; width: var(--w); height: var(--w); display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; border-radius: 10px; color: var(--ink); }
  /* untapped (ready, hits back): lies flat and greyed out; tapped (attacking): stands up sideways and lights up in colour */
  .btn img { width: var(--w); height: calc(var(--w) * 31 / 88); image-rendering: pixelated; transition: transform .2s, filter .2s; filter: grayscale(1) brightness(.6); }
  .btn.tapped img { transform: rotate(90deg); filter: drop-shadow(0 0 8px rgba(255,111,207,.8)); }
  .btn.can { cursor: pointer; outline: 2px dashed var(--S); outline-offset: 2px; }
  .btn.sel { outline: 2px solid var(--H); box-shadow: 0 0 16px rgba(255,111,207,.6); }
  .btn.att { outline: 2px solid var(--D); box-shadow: 0 0 16px rgba(90,209,255,.6); }
  .out { opacity: .25; }
  /* power/life left in the button's bottom-right corner (a soft glow), and damage being placed on it in the top-right */
  .pt, .dmg { position: absolute; font-family: var(--meme); letter-spacing: .5px; line-height: 1; pointer-events: none; }
  .pt { right: 8px; bottom: 6px; font-size: calc(var(--w) * .1); color: var(--ink); text-shadow: 0 0 4px rgba(176,132,255,.45); }
  .dmg { right: 8px; top: 6px; font-size: calc(var(--w) * .14); color: var(--H); text-shadow: 0 0 8px var(--H); }
  .bar { text-align: center; }
  /* your status line, at the top of your panel: this turn, then (smaller, at the right) only the end of the match, an error or a disconnect; one line, cut with … if too long */
  .statusline { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 700 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-transform: none; letter-spacing: 0; text-align: right; color: var(--mute); text-shadow: 0 0 10px rgba(176,132,255,.75); }
  button.act { width: 100%; height: 54px; border-radius: 14px; border: 0; cursor: pointer; color: var(--ink);
               background: linear-gradient(135deg, #b084ff, #ff6fcf); font-family: var(--meme); font-size: 19px; letter-spacing: .5px;
               text-transform: uppercase; text-shadow: 0 0 6px rgba(255,255,255,.35); box-shadow: 0 0 22px rgba(255,111,207,.45); }
  /* the log: the 5 newest lines, newest at the top; new lines appear one at a time (LINE_MS apart) */
  button.act:disabled { cursor: default; filter: grayscale(1); opacity: .4; box-shadow: none; }
  #log { white-space: pre-wrap; font-size: 15px; line-height: 1.5; min-height: calc(5 * 1.5em + 20px); overflow: hidden; background: var(--panel); border: 1px solid var(--line);
         border-radius: 14px; padding: 10px 12px; color: var(--dim); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .err { color: #ffb3b3; }
  /* the deck: the buttons still to come in, half size, next one on the left; before the first attack, drag one of yours onto a field button to swap them */
  .deck { display: flex; gap: 8px; margin-top: 10px; min-height: calc(var(--w) / 2 * 31 / 88); }
  .deck img { width: calc(var(--w) / 2); height: calc(var(--w) / 2 * 31 / 88); image-rendering: pixelated; filter: grayscale(1) brightness(.6); }
  .deck img.drag { cursor: grab; outline: 1px dashed var(--S); outline-offset: 2px; touch-action: none; filter: none; }
  .ghost { position: fixed; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; z-index: 9; width: calc(var(--w) / 2); image-rendering: pixelated; }
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
</style>
</head>
<body>
<div id="game">
<h1>UN/CLICK</h1>
  <div class="side"><div id="themHp"></div><div class="row" id="them"></div><div class="deck" id="themDeck"></div></div>
  <div class="bar"><button class="act" id="start" hidden>start</button> <button class="act" id="attack" hidden>attack</button> <button class="act" id="take" hidden>take</button> <button class="act" id="again" hidden>new match</button></div>
  <div class="side"><div class="statusline"><span id="meHp"></span><span id="status"><span id="result"></span> <span id="err" class="err"></span></span></div><div class="row" id="me"></div><div class="deck" id="meDeck"></div></div>
  <div id="log"></div>
  <!-- the footer every game shows (dungeon-items src/footer.js), with this game's version: raise data-version every version; data-copy="no" leaves out the 🄯 (the buttons include remixes of other people's art, uncredited here) -->
  <div id="ddfoot"></div>
</div>
<script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.37" data-copy="no"></script>
<script>
const $ = (id) => document.getElementById(id);
{
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname}/ws`);
  let g = null;
  const send = (o) => ws.send(JSON.stringify(o));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error) { $("err").textContent = d.error; return; }
    g = d.g; $("err").textContent = ""; draw();
  };
  ws.onclose = () => { $("err").textContent = "disconnected: reload"; };
  const LINE_MS = 450;
  let shown = null, logTimer = null;
  // shows one more log line each LINE_MS until the log is caught up, newest at the top
  function showLog() {
    logTimer = null;
    if (shown < g.log.length) shown++; else shown = g.log.length;
    $("log").textContent = g.log.slice(0, shown).slice(-5).reverse().join("\n");
    if (shown < g.log.length) logTimer = setTimeout(showLog, LINE_MS);
  }
  let picked = new Set(), split = {}, seen = "";
  $("attack").onclick = () => send({ do: "attack", idxs: [...picked] });
  $("take").onclick = () => send({ do: "take", split });
  $("start").onclick = () => send({ do: "start" });
  $("again").onclick = () => location.assign("/"); // the main page starts a new match

  function draw() {
    const me = "a", them = "b", mine = g.sides[me].buttons, theirs = g.sides[them].buttons;
    const key = `${g.turn}|${g.attack ? g.attack.by : ""}|${g.log.length}|${mine.map((b) => b.id).join()}`;
    if (key !== seen) { seen = key; picked = new Set(); split = {}; } // a new step: clear picks
    const taking = g.attack && g.attack.by === them && !g.winner;
    const life = (b) => (b.out ? 0 : b.toughness - b.damage);
    const myTurn = g.turn === me && !g.attack && !g.winner;
    const ready = (b) => !b.out && !b.tapped;
    // what you must place when they attack: their attack's total, or all your buttons' life left if that's less
    const need = taking ? Math.min(g.attack.attackers.reduce((n, i) => n + theirs[i].power, 0), mine.reduce((n, b) => n + life(b), 0)) : 0;
    const placed = Object.values(split).reduce((n, d) => n + d, 0);
    // your row: on your turn click to pick up to g.limit attackers (1 on the match's first turn, then 2; they show tapped; no more can be picked); when they attack, each click puts 1 damage on
    // that button (up to its life left; one more click clears it)
    row($("me"), mine, (b, i) => {
      if (myTurn && ready(b) && (picked.has(i) || picked.size < g.limit)) return { can: true, tapped: picked.has(i), click: () => { picked.has(i) ? picked.delete(i) : picked.add(i); draw(); } };
      if (taking && !b.out) {
        const d = split[i] ?? 0;
        return { can: true, sel: d > 0, note: d ? `-${d}` : "",
          click: () => { if (d < life(b) && placed < need) split[i] = d + 1; else delete split[i]; draw(); } };
      }
      return {};
    });
    row($("them"), theirs, (b, i) => (taking && g.attack.attackers.includes(i) ? { att: true } : {}));
    // THIS TURN: attack = power of your buttons tapped or picked to attack; defense = life left on your ready buttons (the ones that hit back)
    const up = (b, i) => !b.out && (b.tapped || picked.has(i));
    const atk = mine.reduce((n, b, i) => n + (up(b, i) ? b.power : 0), 0);
    const def = mine.reduce((n, b, i) => n + (!b.out && !up(b, i) ? life(b) : 0), 0);
    $("meHp").textContent = `you · this turn: ${atk}/${def}`;
    $("themHp").textContent = "dummy";
    deckRow($("meDeck"), g.sides[me].deck ?? [], g.locked === false && !g.winner);
    deckRow($("themDeck"), g.sides[them].deck ?? [], false);
    // the dummy won the flip: it waits for start, so you can swap first
    const startNow = g.locked === false && g.turn === them && !g.winner;
    $("start").hidden = !startNow;
    $("result").textContent = g.winner ? `${g.winner === "draw" ? "draw" : g.winner === me ? "you win" : "you lose"}` : "";
    // the attack button is always there unless take or new match takes its place; greyed out while it isn't your move
    $("attack").hidden = taking || !!g.winner || startNow;
    $("attack").disabled = !myTurn;
    $("take").hidden = !taking;
    $("take").disabled = placed !== need;
    $("take").textContent = placed === need ? `take ${need}` : `place ${need - placed} more`;
    $("again").hidden = !g.winner;
    if (shown === null) shown = g.log.length; // first board after loading: the whole log at once
    if (!logTimer) showLog();
  }
  function deckRow(el, list, can) {
    el.innerHTML = "";
    list.forEach((b, j) => {
      const img = document.createElement("img"); img.alt = ""; img.src = b.image; img.title = `${b.name} ${b.power}/${b.toughness}`;
      if (can) { img.className = "drag"; img.onpointerdown = (e) => drag(e, j, img); }
      el.append(img);
    });
  }
  // drag a deck picture (mouse or touch) and drop it on one of your field buttons to swap the two
  function drag(e, j, img) {
    e.preventDefault();
    const ghost = img.cloneNode(); ghost.className = "ghost"; document.body.append(ghost);
    const at = (ev) => { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; };
    const end = (ev) => {
      ghost.remove();
      removeEventListener("pointermove", at); removeEventListener("pointerup", end); removeEventListener("pointercancel", end);
      const t = ev.type === "pointerup" && document.elementFromPoint(ev.clientX, ev.clientY)?.closest("#me .btn");
      if (t) send({ do: "swap", i: Number(t.dataset.i), j });
    };
    at(e);
    addEventListener("pointermove", at); addEventListener("pointerup", end); addEventListener("pointercancel", end);
  }
  function row(el, buttons, how) {
    el.innerHTML = "";
    buttons.forEach((b, i) => {
      const h = how(b, i);
      const wrap = document.createElement("div");
      if (b.out) wrap.className = "out";
      const btn = document.createElement("button");
      btn.className = "btn" + (b.tapped || h.tapped ? " tapped" : "") + (h.can ? " can" : "") + (h.sel ? " sel" : "") + (h.att ? " att" : "");
      const img = document.createElement("img"); img.alt = ""; img.src = b.image; btn.append(img);
      if (h.click) btn.onclick = h.click;
      const pt = document.createElement("span"); pt.className = "pt"; pt.textContent = `${b.power}/${b.toughness - b.damage}`;
      btn.append(pt);
      if (h.note) { const d = document.createElement("span"); d.className = "dmg"; d.textContent = h.note; btn.append(d); }
      btn.title = b.name;
      btn.dataset.i = i;
      wrap.append(btn); el.append(wrap);
    });
  }
}
</script>
</body>
</html>
