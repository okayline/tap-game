<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UN/TAP</title>
<!-- the two fonts are served from this Worker (public/fonts, latin only, from npm's @fontsource; SIL Open Font License), not Google Fonts,
     so a phone doesn't open two more connections before the page shows (kura, Nov 3) -->
<link rel="preload" href="/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/eb-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Cinzel; font-weight: 600; font-display: swap; src: url(/fonts/cinzel-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Cinzel; font-weight: 800; font-display: swap; src: url(/fonts/cinzel-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-display: swap; src: url(/fonts/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 700; font-display: swap; src: url(/fonts/eb-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-style: italic; font-display: swap; src: url(/fonts/eb-garamond-latin-500-italic.woff2) format("woff2"); }
  /* themed "Grimoire Pastel" (kura, Nov 3): each button is a card like a Magic card (name bar, art, type line, text box,
     power/toughness box), in light pastel blues, pinks and cream, with Cinzel and EB Garamond */
  :root {
    --bg: #1d2742;   /* midnight blue (kura, Nov 3: the pastel sky was too bright) */ --panel: #f7fbff; --line: #b9d0ea; --frame: #8fb6de; --cream: #fffaf2;
    --ink: #3a4a6b; --mute: #5a6a8a; --pink: #e98ab3; --blue: #6d8fd0;
    /* the two number colours (kura, Nov 3: one pair that fits the pinks and blues): damage is a deeper card pink, ping power a deeper page blue */
    --hit: #d4558c; --zap: #5578c4;
    --title: Cinzel, Georgia, serif; --body: "EB Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }   /* the page itself never scrolls */
  body { min-height: 100vh; font: 15px/1.35 var(--body); }
  /* a card is --w wide (108px at the mockup's size, up to 176px, smaller on a narrow screen so three fit across) and --h/108 as tall;
     --u is the mockup's 1px at that width, so every size in a card scales with it */
  :root { --w: min(176px, calc((100vw - 92px) / 3)); --u: calc(var(--w) / 108); }
  /* --h is a card's height in --u (150 on the mockup); --t scales the card text, flavour and P/T (the name and type line keep their size, so long names and the set sign fit) */
  :root { --h: 150; --t: 1; }
  /* nothing on the game screen can be selected or long-pressed into a selection, so taps and drags never highlight text */
  #game { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #game { max-width: 620px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  /* on a window too short for the whole screen, the screen is shrunk to fit (fit(), below), as if zoomed out, so the cards keep their size */
  #game { transform-origin: top center; }
  h1 { font: 800 24px/1 var(--title); letter-spacing: 2px; color: #d97aa6; margin: 0; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 18px; transition: filter .3s; }
  /* the side that isn't moving now is dimmed (kura, Nov 3) */
  .side.dim { filter: brightness(.8) saturate(.7); }
  .side > div:first-child { font: 600 12px/1 var(--title); letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); }
  .row { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 8px; height: calc(var(--h) * var(--u)); }
  .btn { position: relative; width: var(--w); height: calc(var(--h) * var(--u)); display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; border-radius: calc(7 * var(--u)); color: var(--ink); }
  /* the card: blue frame, cream inside */
  .gc { width: 100%; height: 100%; background: var(--frame); border-radius: calc(7 * var(--u)); padding: calc(5 * var(--u)); display: flex; flex-direction: column; }
  .gc-in { flex: 1; position: relative; background: var(--cream); border-radius: calc(3 * var(--u)); padding: calc(4 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); border: 1px solid var(--line); text-align: left; }
  /* names are 8.5, and a long one (LONG_NAME letters or more) is 6.7 (kura, Nov 3): in Cinzel, every 88x31 name of 15 letters or fewer
     fits at 8.5, and every name fits at 6.7 ("1,000,000th Visitor" and "Best Viewed 800x600" are the longest) */
  .gc-name.long { font-size: calc(6.7 * var(--u)); }
  .gc-name { font: 600 calc(8.5 * var(--u))/1 var(--title); color: var(--ink); background: #ffe1ee; border: 1px solid #f0b8d0; border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(12 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .gc-art { height: calc(31 * var(--u)); display: flex; align-items: center; justify-content: center; }
  .gc-art img, .gc-art canvas { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  .gc-type { font: 500 calc(8 * var(--u))/1 var(--body); color: var(--ink); background: #e2f0ff; border: 1px solid var(--line); border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(15 * var(--u)); display: flex; align-items: center; justify-content: space-between; gap: calc(3 * var(--u)); white-space: nowrap; overflow: hidden; }
  /* the set sign at the right of the type line (kura, Nov 3): Alpha a globe, Beta a floppy disk, none for a button outside a series;
     coloured by rarity in pastel (88x31's rarity colours, softened; dungeon-notes 88x31/tap-game-idea.md "Set signs") */
  .sym { flex: none; width: calc(10 * var(--u)); height: calc(10 * var(--u)); overflow: visible; }
  .sym path { fill: var(--rar); stroke: var(--rar-edge); stroke-width: 1; stroke-linejoin: round; }
  .sym path + path { fill: none; stroke-width: .9; }
  .sym.common { --rar: #5a6a8a; --rar-edge: #3a4a6b; } .sym.uncommon { --rar: #8fe0e6; --rar-edge: #3f9aa3; }
  .sym.rare { --rar: #f6d860; --rar-edge: #a98a1c; } .sym.ultra { --rar: #e88ee0; --rar-edge: #8a3a84; }
  .sym.ultra path:first-of-type { stroke: #fff; } .sym.ultra { filter: drop-shadow(0 0 1px #8a3a84); }
  .sym.prototype { --rar: #d6d6de; --rar-edge: #7a7a88; } .sym.prototype path:first-of-type { stroke-dasharray: 1.6 1.2; }
  /* the text box: the effect, a thin line, then a flavour line (kura, Nov 3, the flavour board); sized so the flavour line clears the P/T box */
  .gc-txt { flex: 1; min-height: 0; overflow: hidden; background: #fffdf8; border: 1px solid var(--line); border-radius: 2px;
          padding: calc(4 * var(--u)) calc(4 * var(--u)) calc(9 * var(--u)); font: 500 calc(7.5 * var(--t) * var(--u))/1.12 var(--body); color: var(--ink);
          display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
  .gc-txt b { font-weight: 700; }
  .gc-txt .rule { width: 60%; height: 1px; background: #d9c9a8; align-self: center; flex: none; }
  .gc-txt .flav { font: italic 500 calc(6.8 * var(--t) * var(--u))/1.1 var(--body); color: var(--mute); }
  /* power/life left, in a box sitting on the bottom edge of the text box (like a Magic card's) */
  .pt { position: absolute; right: calc(4 * var(--u)); bottom: 1px; font: 800 calc(9 * var(--t) * var(--u))/1 var(--title); color: var(--ink); background: #fff3c9; border: 1.5px solid #e2c56e;
        border-radius: calc(5 * var(--u)); padding: calc(2 * var(--u)) calc(5 * var(--u)); box-shadow: 0 0 0 1.5px var(--cream), inset 0 1px 0 #fff; pointer-events: none; }
  .pt .up, .dpt .up { color: #45b07a; }
  .pt .hurt, .dpt .hurt { color: var(--hit); }
  /* tapped (attacking): the card turns sideways to the right, shrunk so its long side is the card's width and it stays inside its spot */
  .btn.tapped .gc { transform: rotate(90deg) scale(.72); }
  .btn.can { cursor: pointer; outline: 2px dashed var(--pink); outline-offset: 2px; }
  .btn.sel { outline: 2px solid var(--pink); box-shadow: 0 0 12px rgba(233,138,179,.7); }
  .btn.att { outline: 2px solid var(--blue); box-shadow: 0 0 12px rgba(109,143,208,.7); }
  /* a knocked-out button: faded grey, crossed out in pink, no numbers (on the field until replaced, then in the deck row) */
  .btn.out .gc { filter: grayscale(1) opacity(.5); }
  .btn.phased .gc { opacity: .3; }   /* Phasing (rules.js EXTRA): phased out, it's not really there */
  .btn.out::before, .btn.out::after, .card.gone::before, .card.gone::after { content: ""; position: absolute; left: 50%; top: 50%; width: 45%; height: calc(7 * var(--u));
               border-radius: 4px; background: #e57fa6; transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 1; }
  .card.gone::before, .card.gone::after { width: 50%; height: 3px; border-radius: 2px; }
  .btn.out::after, .card.gone::after { transform: translate(-50%, -50%) rotate(-45deg); }
  /* damage being placed on a button, over its art */
  .dmg { position: absolute; left: 50%; top: calc(42 * var(--u)); transform: translateX(-50%); font: 800 calc(14 * var(--u))/1 var(--title); color: var(--hit);
         background: var(--cream); border: 1.5px solid var(--hit); border-radius: 6px; padding: 2px 6px; pointer-events: none; z-index: 2; }
  /* the fight replay (v0.69): a number rising off a card (--hit: damage it took; --zap: an attacker's power), in a cream outline */
  .pop { position: absolute; left: 50%; top: calc(40 * var(--u)); font: 800 calc(18 * var(--u))/1 var(--title); color: var(--hit); pointer-events: none; z-index: 3;
         text-shadow: 0 0 2px var(--cream), 0 0 2px var(--cream), 0 0 5px var(--cream); animation: rise 1.6s ease-out both; }   /* both: hidden while it waits */
  .pop.atk { color: var(--zap); }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
                    70% { opacity: 1; transform: translate(-50%, -18px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -28px) scale(1); } }
  /* a hit glitches (kura, Nov 3: "instead of shakes ... some glitchy animations", "a couple different effects and have it randomly
     choose one"), snapping from frame to frame; each hit picks one (GLITCHES, below). The card itself (.gc) carries the colour
     effects, so a tapped card keeps its turn; the spot (.btn) carries the movement.
       g1 tear:   the spot jumps about; pink and cyan fringes split off and the card tears into slices
       g2 signal: the spot jumps about; the card flickers out, flashes inverted, goes washed-out grey, like a signal dropping
       glyph:     the card's text scrambles into junk characters and settles back (glyphs(), below), with faint fringes on the
                  letters, and the spot jumps about like the others (kura, Nov 3: no shear, it "moves too much"; "give glyph a small
                  jitter too")
       moji:      the card's text turns into wrong-encoding mess ("Ã©", "â€™") and snaps back (mojibake(), below)
       noimg:     the whole card front is replaced by an old browser's broken image: a dotted box, the broken-picture icon and the
                  alt text at the top left (kura, Nov 3: "make the whole card front the missing image"), then comes back (noImage())
     (kura, Nov 3: mojibake and missing image, from a list of ideas) */
  .btn.hit.g1, .btn.hit.g2, .btn.hit.glyph, .btn.hit.moji, .btn.hit.noimg { animation: jitter .6s steps(1, end); }
  .btn.hit.g1 .gc { animation: tear .6s steps(1, end); }
  .btn.hit.g2 .gc { animation: signal .6s steps(1, end); }
  .btn.hit.glyph .gc { animation: fringe .6s steps(1, end); }
  /* the missing image: the card's front becomes a dotted box with a broken-picture icon and the button's name, in an old browser's look */
  .broken { flex: 1; display: flex; align-items: flex-start; gap: calc(4 * var(--u)); padding: calc(5 * var(--u));
            border: 1px dotted #8a8a8a; border-radius: calc(3 * var(--u)); background: #fff; font: calc(9 * var(--u))/1.2 "Times New Roman", serif; color: #000; overflow: hidden; }
  .broken svg { flex: none; width: calc(13 * var(--u)); height: calc(16 * var(--u)); }
  @keyframes signal {
    0% { opacity: 1; filter: none; } 10% { opacity: .2; filter: brightness(2); } 20% { opacity: 1; filter: invert(1) hue-rotate(180deg); }
    30% { opacity: .45; filter: none; } 45% { opacity: 1; filter: contrast(1.8) saturate(0); } 60% { opacity: .15; filter: none; }
    75% { opacity: 1; filter: brightness(1.35); } 90%, 100% { opacity: 1; filter: none; } }
  @keyframes fringe {
    0% { text-shadow: none; } 10% { text-shadow: -1px 0 #ff6fb0, 1px 0 #5fdcff; } 30% { text-shadow: 1px 0 #ff6fb0, -1px 0 #5fdcff; }
    50% { text-shadow: none; } 65% { text-shadow: -1px 0 #ff6fb0, 1px 0 #5fdcff; } 85%, 100% { text-shadow: none; } }
  @keyframes jitter { 0% { transform: translate(0, 0); } 10% { transform: translate(-4px, 1px); } 20% { transform: translate(3px, -1px); } 30% { transform: translate(-2px, 0); }
                      45% { transform: translate(5px, 0); } 60% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 0); } 90%, 100% { transform: translate(0, 0); } }
  @keyframes tear {
    0% { filter: none; clip-path: none; }
    10% { filter: drop-shadow(-3px 0 0 #ff6fb0) drop-shadow(3px 0 0 #5fdcff); clip-path: inset(8% 0 52% 0); }
    20% { filter: drop-shadow(3px 0 0 #ff6fb0) drop-shadow(-3px 0 0 #5fdcff); clip-path: inset(58% 0 6% 0); }
    30% { filter: hue-rotate(80deg) saturate(1.8); clip-path: none; }
    45% { filter: drop-shadow(-2px 0 0 #ff6fb0) drop-shadow(2px 0 0 #5fdcff); clip-path: inset(30% 0 38% 0); }
    60% { filter: none; clip-path: inset(0 0 68% 0); }
    75% { filter: drop-shadow(2px 0 0 #ff6fb0) drop-shadow(-2px 0 0 #5fdcff) brightness(1.15); clip-path: none; }
    90%, 100% { filter: none; clip-path: none; } }
  /* a ping (kura, Nov 3: "a line travels over and connects, then a little glow of light goes over and comes back"): a pink line
     from the pinging card around the button to the cards it reaches, at right angles only ("not at diagonals"), and a glow that runs along each
     branch and back, slowly (makePing(), below) */
  .pingfx { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 8; overflow: visible; }
  /* the guest's pings are blue, yours pink (kura, Nov 3: "can the enemy ping lines be blue ?"); the glow's halo matches its line */
  .pingfx.theirs polyline { stroke: var(--blue); }
  .pingfx.theirs .over { filter: drop-shadow(0 0 3px rgba(109,143,208,.9)); }
  .spark.theirs { box-shadow: 0 0 8px 4px #fff, 0 0 18px 8px rgba(109,143,208,.8); }
  /* a branch to a card you didn't pick turns grey when the glow runs (kura, Nov 3) */
  .pingfx polyline.unused { stroke: #9aa3b8; transition: stroke .3s; }
  .pingfx polyline { fill: none; stroke-linejoin: round; stroke: var(--pink); stroke-width: 3; stroke-linecap: round; }
  /* one glow for the whole layer (.over), not one per line, so lines lying on each other look like one line (kura, Nov 3: the second
     attacker's line made the first one's brighter); grey unused branches sit underneath (.under), unglowing and a little faded */
  .pingfx .over { filter: drop-shadow(0 0 3px rgba(233,138,179,.9)); }
  .pingfx .under { opacity: .7; }
  .spark { position: fixed; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #fff; pointer-events: none; z-index: 9;
           box-shadow: 0 0 8px 4px #fff, 0 0 18px 8px rgba(233,138,179,.8); }
  .bar { text-align: center; }
  /* your status line, at the top of your panel: this turn, then (smaller, at the right) only the end of the match, an error or a disconnect; one line, cut with … if too long */
  .statusline { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  .tough { margin-left: auto; }
  /* the total's numbers, bigger and bold (kura, Nov 3) */
  .tough b { font: 800 18px/1 var(--title); letter-spacing: 1px; margin-left: 4px; }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: italic 500 14px/1.2 var(--body);
            text-transform: none; letter-spacing: 0; text-align: right; color: var(--mute); }
  button.act { width: 100%; height: 50px; border-radius: 6px; border: 2px solid #fff; cursor: pointer; color: #3a2a4a; background: #f7b3cf;
               font: 800 17px/1 var(--title); letter-spacing: 3px; text-transform: uppercase; }
  button.act:disabled { cursor: default; filter: grayscale(1); opacity: .4; }
  button.act.lit:disabled { filter: none; opacity: 1; }   /* the coin flip: lit pink while it flips and when you won, though it can't be pressed (kura, Nov 3) */
  /* the log: the 5 newest lines, newest at the top; new lines appear one at a time (LINE_MS apart) */
  #log { white-space: pre-wrap; font: italic 500 15px/1.5 var(--body); min-height: calc(5 * 1.5em + 20px); overflow: hidden; background: var(--cream); border: 1px solid var(--line);
         border-radius: 6px; padding: 10px 14px; color: var(--ink); }
  .err { color: #b3305f; }
  /* the deck: the buttons still to come in, small, next one on the left; drag one of yours onto a field button to swap them */
  /* 6 across, as wide as the field row (3 cards and 2 gaps of 12px) with 5 gaps of 8px; each in a little blue frame */
  :root { --dw: calc((var(--w) * 3 - 16px) / 6 - 6px); }
  .deck { display: flex; gap: 8px; margin-top: 10px; padding-bottom: 8px; min-height: calc(var(--dw) * 31 / 88 + 6px); }
  .deck .card { position: relative; background: var(--frame); border-radius: 4px; padding: 3px; }
  .deck img, .deck canvas { display: block; width: var(--dw); height: calc(var(--dw) * 31 / 88); image-rendering: pixelated; }
  /* knocked-out ones stay greyed */
  .deck .card.gone canvas { filter: grayscale(1) opacity(.45); }
  /* a guest's deck card, face down: the card back's stripes (.zback) */
  .deck .facedown { width: var(--dw); height: calc(var(--dw) * 31 / 88); background: repeating-linear-gradient(45deg, var(--frame) 0 4px, color-mix(in srgb, var(--frame) 85%, #000) 4px 8px); }
  .deck .card.drag { cursor: grab; outline: 1px dashed var(--pink); outline-offset: 2px; touch-action: none; }
  /* power/life left in a small box over the bottom-right corner of the deck button's picture, like the field cards' */
  .deck .dpt { position: absolute; right: 4px; bottom: 4px; font: 800 10px/1 var(--title); color: var(--ink); background: #fff3c9; border: 1px solid #e2c56e;
               border-radius: 4px; padding: 2px 4px; box-shadow: 0 0 0 1px var(--cream); pointer-events: none; }
  .ghost { position: fixed; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; z-index: 9; width: var(--dw); image-rendering: pixelated; }
  /* the flavour line (and the line above it) only shows on the big card (kura, Nov 3: more room for the effect on the field) */
  .gc-txt .rule, .gc-txt .flav { display: none; }
  .zoom .gc-txt .rule, .zoom .gc-txt .flav { display: block; }
  .zoom .gc-txt .flav { font-size: calc(5.8 * var(--t) * var(--u)); }   /* a little smaller than the effect (kura, Nov 3; was 6.8) */
  /* two effects (the type's and a rarity extra) on the big card: a little smaller, so the flavour line still clears the P/T box */
  .zoom .gc-txt.two { font-size: calc(6.6 * var(--t) * var(--u)); }
  /* the big card: hold a card or deck button (hover with a mouse) to see it whole (kura, Nov 3); --u is set again here so the whole card scales */
  .zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(20, 26, 48, .45); pointer-events: none; }
  .zoom .zbox { --w: min(78vw, 300px); --u: calc(var(--w) / 108); width: var(--w); height: calc(var(--h) * var(--u)); position: relative; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); perspective: calc(600 * var(--u)); }
  /* the big card turns with your finger or mouse (kura, Nov 3), and past a quarter turn shows its back: 88x31 club's face-down card
     (okayline/88x31 public/style.css .card.back: its diagonal stripes; kura, Nov 3: "the same back as 88x31 club", then without its "?", then
     in the front's light blue frame colour so the edge runs round onto the back: --frame, and --frame darkened as club's second stripe is) */
  .zflip { position: absolute; inset: 0; transform-style: preserve-3d; }
  /* a finger sliding sideways on a card turns the big card, so the browser mustn't take the slide as a pan (that would cancel the hold) */
  .btn, .deck .card { touch-action: pinch-zoom; }
  .zflip > .gc, .zflip > .zback { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* thickness (kura, Nov 3: "so it doesn't look so thin when you rotate it"): the front sits --zd/2 in front, the back --zd/2 behind,
     and ZEDGE layers of a darker frame blue fill the gap, so a turned card shows an edge */
  .zflip { --zd: calc(1 * var(--u)); }   /* kura, Nov 3: "a little thinner", then "thinner please" (was 2, then 1.5) */
  .zflip > .gc { transform: translateZ(calc(var(--zd) / 2)); }
  .zedge { position: absolute; inset: 0; border-radius: calc(7 * var(--u)); background: color-mix(in srgb, var(--frame) 75%, #000);
           transform: translateZ(calc((var(--k) - .5) * var(--zd))); }
  .zback { transform: rotateY(180deg) translateZ(calc(var(--zd) / 2)); border-radius: calc(7 * var(--u)); background: repeating-linear-gradient(45deg, var(--frame) 0 8px, color-mix(in srgb, var(--frame) 85%, #000) 8px 16px); }
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
  /* the line under your deck row (kura, Nov 3): "hold" on a touch screen, "hover" with a mouse */
  .tip { font: italic 500 13px/1.2 var(--body); color: var(--mute); text-align: center; }
  .tip .mouse { display: none; }
  @media (hover: hover) and (pointer: fine) { .tip .touch { display: none; } .tip .mouse { display: inline; } }
  /* on a phone the panels run to the screen's edges so the three cards are as wide as they can be (kura, Nov 3: "as big as they can reasonably get");
     24px = the panel's 4px sides and two 8px gaps (each just wide enough for a tappable card's dashed outline) */
  @media (max-width: 500px) {
    :root { --w: calc((100vw - 24px) / 3); --dw: calc((var(--w) * 3 - 32px) / 6 - 6px); }
    #game { padding: 8px 0; }
    .side { padding: 8px 4px 14px; border-left: 0; border-right: 0; border-radius: 0; }
    .statusline { padding: 0 2px; }
    .row { gap: 8px; }

    inn.append(name, art, type, txt, pt);
    gc.append(inn); return { gc, art, img, pt };
  }
  // a side's field row. Each spot keeps its card while the same button is in it, and only its classes and numbers change (so the
  // replay can glitch and mark it); a new button in a spot gets a new card. Tapping snaps sideways at once (kura, Nov 3: no turning).
  function row(el, buttons, att, how) {
    el.slots ??= [];
    buttons.forEach((b, i) => {
      const h = how(b, i);
      let s = el.slots[i];
      if (!s || s.id !== b.id) {
        const wrap = document.createElement("div"), btn = document.createElement("button"), parts = card(b);
        btn.append(parts.gc); wrap.append(btn);
        if (el.children[i]) el.children[i].replaceWith(wrap); else el.append(wrap);
        s = el.slots[i] = { id: b.id, btn, parts, moving: null, b };
        const slot = s; zoomable(btn, () => slot.b);
      }
      s.b = b;
      const { btn, parts } = s, tapped = b.tapped || h.tapped;
      btn.className = "btn" + (b.out ? " out" : "") + (b.phased ? " phased" : "") + (tapped ? " tapped" : "") + (h.can ? " can" : "") + (h.sel ? " sel" : "") + (att.has(b.id) ? " att" : "");
      const moving = !b.out && !!tapped;   // the picture only moves while tapped
      if (s.moving !== moving) { parts.art.replaceChildren(moving ? parts.img : still(b, "")); s.moving = moving; }
      parts.pt.replaceChildren(...ptText(b)); parts.pt.hidden = !!b.out;
      btn.onclick = h.click ?? null;
      btn.querySelector(".dmg")?.remove();
      if (h.note) { const d = document.createElement("span"); d.className = "dmg"; d.textContent = h.note; btn.append(d); }
      btn.dataset.i = i; btn.dataset.id = b.id;
    });
    while (el.children.length > buttons.length) el.lastChild.remove();
    el.slots.length = buttons.length;
  }
}
</script>
