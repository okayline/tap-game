<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UN/TAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  /* themed "Grimoire Pastel" (kura, Nov 3): each button is a card like a Magic card (name bar, art, type line, text box,
     power/toughness box), in light pastel blues, pinks and cream, with Cinzel and EB Garamond */
  :root {
    --bg: #1d2742;   /* midnight blue (kura, Nov 3: the pastel sky was too bright) */ --panel: #f7fbff; --line: #b9d0ea; --frame: #8fb6de; --cream: #fffaf2;
    --ink: #3a4a6b; --mute: #5a6a8a; --pink: #e98ab3; --blue: #6d8fd0;
    --title: Cinzel, Georgia, serif; --body: "EB Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }   /* the page itself never scrolls */
  body { min-height: 100vh; font: 15px/1.35 var(--body); }
  /* a card is --w wide (108px at the mockup's size, up to 176px, smaller on a narrow screen so three fit across) and 150/108 as tall;
     --u is the mockup's 1px at that width, so every size in a card scales with it */
  :root { --w: min(176px, calc((100vw - 92px) / 3)); --u: calc(var(--w) / 108); }
  /* nothing on the game screen can be selected or long-pressed into a selection, so taps and drags never highlight text */
  #game { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #game { max-width: 620px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  /* on a window too short for the whole screen, the screen is shrunk to fit (fit(), below), as if zoomed out, so the cards keep their size */
  #game { transform-origin: top center; }
  h1 { font: 800 24px/1 var(--title); letter-spacing: 2px; color: #d97aa6; margin: 0; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 18px; transition: filter .3s; }
  /* the side that isn't moving now is dimmed (kura, Nov 3) */
  .side.dim { filter: brightness(.8) saturate(.7); }
  .side > div:first-child { font: 600 12px/1 var(--title); letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); }
  .row { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 8px; height: calc(150 * var(--u)); }
  .btn { position: relative; width: var(--w); height: calc(150 * var(--u)); display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; border-radius: calc(7 * var(--u)); color: var(--ink); }
  /* the card: blue frame, cream inside */
  .gc { width: 100%; height: 100%; background: var(--frame); border-radius: calc(7 * var(--u)); padding: calc(5 * var(--u)); display: flex; flex-direction: column; transition: transform .2s, filter .2s; }
  .gc-in { flex: 1; position: relative; background: var(--cream); border-radius: calc(3 * var(--u)); padding: calc(4 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); border: 1px solid var(--line); text-align: left; }
  .gc-name { font: 600 calc(8.5 * var(--u))/1 var(--title); color: var(--ink); background: #ffe1ee; border: 1px solid #f0b8d0; border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(15 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .gc-art { height: calc(31 * var(--u)); display: flex; align-items: center; justify-content: center; }
  .gc-art img, .gc-art canvas { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  .gc-type { font: 500 calc(8 * var(--u))/1 var(--body); color: var(--ink); background: #e2f0ff; border: 1px solid var(--line); border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(15 * var(--u)); display: flex; align-items: center; justify-content: space-between; gap: calc(3 * var(--u)); white-space: nowrap; overflow: hidden; }
  /* the set and rarity symbol at the right of the type line: a tiny 88x31 button (the set), in 88x31's own rarity colours (its style.css);
     common has no colour there, so it's the ink colour, as Magic's commons are black */
  .sym { flex: none; width: calc(15 * var(--u)); height: calc(5.5 * var(--u)); border-radius: calc(1.5 * var(--u)); background: var(--ink); border: 1px solid rgba(0,0,0,.35); }
  .sym.uncommon { background: #00ffff; } .sym.rare { background: #ffff00; } .sym.ultra { background: #ff00ff; outline: 1px solid #fff; }
  .sym.prototype { background: #c8c8d0; border: 1px dashed #6a6a78; } .sym.special { background: #ff9900; }
  .gc-txt { flex: 1; background: #fffdf8; border: 1px solid var(--line); border-radius: 2px; padding: calc(4 * var(--u)) calc(4 * var(--u)) calc(12 * var(--u));
          font: 500 calc(8.5 * var(--u))/1.2 var(--body); color: var(--ink); }
  .gc-txt b { font-weight: 700; }
  /* power/life left, in a box sitting on the bottom edge of the text box (like a Magic card's) */
  .pt { position: absolute; right: calc(4 * var(--u)); bottom: 1px; font: 800 calc(9 * var(--u))/1 var(--title); color: var(--ink); background: #fff3c9; border: 1.5px solid #e2c56e;
        border-radius: calc(5 * var(--u)); padding: calc(2 * var(--u)) calc(5 * var(--u)); box-shadow: 0 0 0 1.5px var(--cream), inset 0 1px 0 #fff; pointer-events: none; }
  .pt .up, .dpt .up { color: #45b07a; }
  .pt .hurt, .dpt .hurt { color: #e5677f; }
  /* tapped (attacking): the card turns sideways to the right, shrunk so its long side is the card's width and it stays inside its spot */
  .btn.tapped .gc { transform: rotate(90deg) scale(.72); }
  .btn.can { cursor: pointer; outline: 2px dashed var(--pink); outline-offset: 2px; }
  .btn.sel { outline: 2px solid var(--pink); box-shadow: 0 0 12px rgba(233,138,179,.7); }
  .btn.att { outline: 2px solid var(--blue); box-shadow: 0 0 12px rgba(109,143,208,.7); }
  /* a knocked-out button: faded grey, crossed out in pink, no numbers (on the field until replaced, then in the deck row) */
  .btn.out .gc { filter: grayscale(1) opacity(.5); }
  .btn.out::before, .btn.out::after, .card.gone::before, .card.gone::after { content: ""; position: absolute; left: 50%; top: 50%; width: 45%; height: calc(7 * var(--u));
               border-radius: 4px; background: #e57fa6; transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; z-index: 1; }
  .card.gone::before, .card.gone::after { width: 50%; height: 3px; border-radius: 2px; }
  .btn.out::after, .card.gone::after { transform: translate(-50%, -50%) rotate(-45deg); }
  /* damage being placed on a button, over its art */
  .dmg { position: absolute; left: 50%; top: calc(42 * var(--u)); transform: translateX(-50%); font: 800 calc(14 * var(--u))/1 var(--title); color: #c2416b;
         background: var(--cream); border: 1.5px solid var(--pink); border-radius: 6px; padding: 2px 6px; pointer-events: none; z-index: 2; }
  .bar { text-align: center; }
  /* your status line, at the top of your panel: this turn, then (smaller, at the right) only the end of the match, an error or a disconnect; one line, cut with … if too long */
  .statusline { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  .tough { margin-left: auto; }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: italic 500 14px/1.2 var(--body);
            text-transform: none; letter-spacing: 0; text-align: right; color: var(--mute); }
  button.act { width: 100%; height: 50px; border-radius: 6px; border: 2px solid #fff; cursor: pointer; color: #3a2a4a; background: #f7b3cf;
               font: 800 17px/1 var(--title); letter-spacing: 3px; text-transform: uppercase; }
  button.act:disabled { cursor: default; filter: grayscale(1); opacity: .4; }
  /* the log: the 5 newest lines, newest at the top; new lines appear one at a time (LINE_MS apart) */
  #log { white-space: pre-wrap; font: italic 500 15px/1.5 var(--body); min-height: calc(5 * 1.5em + 20px); overflow: hidden; background: var(--cream); border: 1px solid var(--line);
         border-radius: 6px; padding: 10px 14px; color: var(--ink); }
  .err { color: #b3305f; }
  /* the deck: the buttons still to come in, small, next one on the left; drag one of yours onto a field button to swap them */
  /* 6 across, as wide as the field row (3 cards and 2 gaps of 12px) with 5 gaps of 8px; each in a little blue frame */
  :root { --dw: calc((var(--w) * 3 - 16px) / 6 - 6px); }
  .deck { display: flex; gap: 8px; margin-top: 10px; padding-bottom: 8px; min-height: calc(var(--dw) * 31 / 88 + 6px); }
  .deck .card { position: relative; background: var(--frame); border-radius: 4px; padding: 3px; }
  .deck img, .deck canvas { display: block; width: var(--dw); height: calc(var(--dw) * 31 / 88); image-rendering: pixelated; }
  /* knocked-out ones stay greyed */
  .deck .card.gone canvas { filter: grayscale(1) opacity(.45); }
  .deck .card.drag { cursor: grab; outline: 1px dashed var(--pink); outline-offset: 2px; touch-action: none; }
  /* power/life left in a small box over the bottom-right corner of the deck button's picture, like the field cards' */
  .deck .dpt { position: absolute; right: 4px; bottom: 4px; font: 800 10px/1 var(--title); color: var(--ink); background: #fff3c9; border: 1px solid #e2c56e;
               border-radius: 4px; padding: 2px 4px; box-shadow: 0 0 0 1px var(--cream); pointer-events: none; }
  .ghost { position: fixed; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; z-index: 9; width: var(--dw); image-rendering: pixelated; }
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
</style>
</head>
<body>
<div id="game">
<h1>UN/TAP</h1>
  <div class="side" id="themSide"><div class="statusline"><span id="themHp"></span><span class="tough" id="themTough"></span></div><div class="row" id="them"></div><div class="deck" id="themDeck"></div></div>
  <div class="bar"><button class="act" id="start" hidden>start</button> <button class="act" id="attack" hidden>ping</button> <button class="act" id="take" hidden>take</button> <button class="act" id="again" hidden>new match</button></div>
  <div class="side" id="meSide"><div class="statusline"><span id="meHp"></span><span id="status"><span id="result"></span> <span id="err" class="err"></span></span><span class="tough" id="meTough"></span></div><div class="row" id="me"></div><div class="deck" id="meDeck"></div></div>
  <div id="log"></div>
  <!-- the footer every game shows (dungeon-items src/footer.js), with this game's version: raise data-version every version; data-copy="no" leaves out the 🄯 (the buttons include remixes of other people's art, uncredited here) -->
  <div id="ddfoot"></div>
</div>
<script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.66" data-copy="no"></script>
<script>
const $ = (id) => document.getElementById(id);
{
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname}/ws`);
  let g = null;
  const send = (o) => ws.send(JSON.stringify(o));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error) { $("err").textContent = d.error; return; }
    g = d.g; $("err").textContent = ""; draw();
  };
  // shrink the whole screen to fit a short window (never grow it); offsetHeight is the unshrunk height, since a transform doesn't change layout
  const fit = () => { const g = $("game"); g.style.transform = `scale(${Math.min(1, innerHeight / g.offsetHeight)})`; };
  addEventListener("resize", fit); fit();
  ws.onclose = () => { $("err").textContent = "disconnected: reload"; };
  const LINE_MS = 450;
  let shown = null, logTimer = null;
  // shows one more log line each LINE_MS until the log is caught up, newest at the top
  function showLog() {
    logTimer = null;
    if (shown < g.log.length) shown++; else shown = g.log.length;
    // newest on top at full strength, each older line fainter, down to 50% for the fifth
    $("log").replaceChildren(...g.log.slice(0, shown).slice(-5).reverse().map((t, k) => {
      const d = document.createElement("div"); d.textContent = `C:\\> ${t}`; d.style.opacity = 1 - k * 0.125; return d;   // a DOS prompt before each line (kura, Nov 3)
    }));
    if (shown < g.log.length) logTimer = setTimeout(showLog, LINE_MS);
  }
  let picked = new Set(), split = {}, seen = "";
  $("attack").onclick = () => send({ do: "attack", idxs: [...picked] });
  $("take").onclick = () => send({ do: "take", split });
  $("start").onclick = () => send({ do: "start" });
  $("again").onclick = () => location.assign("/"); // the main page starts a new match

  function draw() {
    const me = "a", them = "b", mine = g.sides[me].buttons, theirs = g.sides[them].buttons;
    const key = `${g.turn}|${g.attack ? g.attack.by : ""}|${g.log.length}|${mine.map((b) => b.id).join()}`;
    if (key !== seen) { seen = key; picked = new Set(); split = {}; } // a new step: clear picks
    const taking = g.attack && g.attack.by === them && !g.winner;
    const life = (b) => (b.out ? 0 : b.toughness + (b.bonus ?? 0) - b.damage);   // rules.js life (bonus: Glow)
    const myTurn = g.turn === me && !g.attack && !g.winner;
    const ready = (b) => !b.out && !b.tapped;
    // what you must place when they attack: their attack's total, or all your buttons' life left if that's less
    const need = taking ? Math.min(g.attack.attackers.reduce((n, i) => n + theirs[i].power, 0), mine.reduce((n, b) => n + life(b), 0)) : 0;
    const placed = Object.values(split).reduce((n, d) => n + d, 0);
    // your row: on your turn click to pick up to g.limit attackers (1 on the match's first turn, then 2; they show tapped; no more can be picked); when they attack, each click puts 1 damage on
    // that button (up to its life left; one more click clears it)
    row($("me"), mine, (b, i) => {
      if (myTurn && ready(b) && (!b.sick || BROAD.includes(b.type)) && (picked.has(i) || picked.size < g.limit)) return { can: true, tapped: picked.has(i) && !ONLINE.includes(b.type), sel: picked.has(i) && ONLINE.includes(b.type), click: () => { picked.has(i) ? picked.delete(i) : picked.add(i); draw(); } };
      if (taking && !b.out) {
        const d = split[i] ?? 0;
        return { can: true, sel: d > 0, note: d ? `-${d}` : "",
          click: () => { if (d < life(b) && placed < need) split[i] = d + 1; else delete split[i]; draw(); } };
      }
      return {};
    });
    row($("them"), theirs, (b, i) => (taking && g.attack.attackers.includes(i) ? { att: true } : {}));
    // THIS TURN: attack = power of your buttons tapped or picked to attack; defense = life left on your ready buttons (the ones that hit back)
    const up = (b, i) => !b.out && (b.tapped || picked.has(i));
    const atk = mine.reduce((n, b, i) => n + (up(b, i) ? b.power : 0), 0);
    const def = mine.reduce((n, b, i) => n + (!b.out && !b.tapped && !(picked.has(i) && !ONLINE.includes(b.type)) ? life(b) : 0), 0);   // an Always Online one picked to attack still defends
    $("meHp").textContent = `player · this turn: ${atk}/${def}`;
    $("themHp").textContent = "guest #1337";   // rules.js NAMES
    // toughness, at the right of each side's top line: life left on all its buttons still in the match (field and deck), out of all its
    // buttons' toughness (kura, Nov 3: "like life")
    const tough = (s) => { const all = [...s.buttons, ...(s.deck ?? []), ...(s.gone ?? [])];
      return `toughness ${all.reduce((n, b) => n + life(b), 0)}/${all.reduce((n, b) => n + b.toughness + (b.bonus ?? 0), 0)}`; };
    $("meTough").textContent = tough(g.sides[me]); $("themTough").textContent = tough(g.sides[them]);
    // you can drag from your deck before the first attack, and on your turn to fill an out spot or make your one swap
    const fill = (g.sides[me].deck ?? []).length > 0 && mine.some((b) => b.out);
    // on your turn with a knocked-out spot, a plain tap on a deck button brings it into the first such spot
    tapInto = myTurn && fill ? mine.findIndex((b) => b.out) : -1;
    deckRow($("meDeck"), g.sides[me], (g.locked === false && !g.winner) || (myTurn && (fill || !g.swapped)));
    deckRow($("themDeck"), g.sides[them], false);
    // the dummy won the flip: it waits for start, so you can swap first
    const startNow = g.locked === false && g.turn === them && !g.winner;
    $("start").hidden = !startNow;
    $("result").textContent = g.winner ? `${g.winner === "draw" ? "draw" : g.winner === me ? "you win" : "you lose"}` : "";
    // the attack button is always there unless take or new match takes its place; greyed out while it isn't your move
    $("attack").hidden = taking || !!g.winner || startNow;
    $("attack").disabled = !myTurn || fill;
    $("attack").textContent = myTurn && fill ? "bring in a button" : "ping";
    $("take").hidden = !taking;
    $("take").disabled = placed !== need;
    $("take").textContent = placed === need ? `take ${need}` : `place ${need - placed} more`;
    $("again").hidden = !g.winner;
    // whose move it is: the side whose turn it is, or the defender while it places an attack; nobody is dimmed once the match is over
    const moving = g.winner ? null : g.attack ? (g.attack.by === me ? them : me) : g.turn;
    $("meSide").classList.toggle("dim", moving === them); $("themSide").classList.toggle("dim", moving === me);
    if (shown === null) shown = g.log.length; // first board after loading: the whole log at once
    if (!logTimer) showLog();
    fit();
  }
  // a side's deck row: its deck (next on the left; power/life left), then its knocked-out buttons, crossed out
  function deckRow(el, side, can) {
    el.innerHTML = "";
    (side.deck ?? []).forEach((b, j) => {
      const card = document.createElement("div"); card.className = "card"; card.title = `${b.name} ${b.power}/${b.toughness - b.damage}`;
      const img = document.createElement("img"); img.alt = ""; img.src = b.image;
      const pt = document.createElement("span"); pt.className = "dpt"; pt.append(...ptText(b));
      card.append(img, pt);
      if (can) { card.classList.add("drag"); card.onpointerdown = (e) => drag(e, j, img); }
      el.append(card);
    });
    (side.gone ?? []).forEach((b) => {
      const card = document.createElement("div"); card.className = "card gone"; card.title = `${b.name} (out)`;
      card.append(still(b, "")); el.append(card);
    });
  }
  // drag a deck picture (mouse or touch) and drop it on one of your field buttons to swap the two
  let tapInto = -1;
  function drag(e, j, img) {
    const x0 = e.clientX, y0 = e.clientY;
    e.preventDefault();
    const ghost = img.cloneNode(); ghost.className = "ghost"; document.body.append(ghost);
    const at = (ev) => { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; };
    const end = (ev) => {
      ghost.remove();
      removeEventListener("pointermove", at); removeEventListener("pointerup", end); removeEventListener("pointercancel", end);
      const t = ev.type === "pointerup" && document.elementFromPoint(ev.clientX, ev.clientY)?.closest("#me .btn");
      if (t) send({ do: "swap", i: Number(t.dataset.i), j });
      else if (ev.type === "pointerup" && tapInto >= 0 && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) send({ do: "swap", i: tapInto, j });
    };
    at(e);
    addEventListener("pointermove", at); addEventListener("pointerup", end); addEventListener("pointercancel", end);
  }
  // a button drawn as a card: name (smaller when long, so it fits on one line, as Magic does), art, type line, an empty text box,
  // and power/life left in a box on the text box's bottom edge (none once it's out)
  // card text by type: only the effects the rules have (rules.js ALWAYS_ONLINE, BROADBAND, WEBCOUNTER, GLOW, LAG_SPIKE, FIREWALL)
  const ONLINE = ["guestbook"], BROAD = ["webring"];   // rules.js ALWAYS_ONLINE and BROADBAND
  const TEXT = { guestbook: ["Always Online", "pinging doesn't tap it."], webring: ["Broadband", "can ping the turn it comes in."],
    counter: ["Webcounter", "+1/+0 each time it hits back."], neon: ["Glow", "+0/+1 for each other Neon on your field."],
    divider: ["Lag Spike", "a button its ping knocks out doesn't hit back."], construction: ["Firewall", "even tapped, it hits back for 1."] };
  // a button's picture only moves while it's tapped (kura, Nov 3): ready or knocked out, it's drawn once onto a canvas, kept per button so
  // it doesn't change frame on every redraw
  // a made-up subtype for each type, after the dash on the type line (kura, Nov 3: flavour only, nothing uses it)
  const SUB = { neon: "Sign", guestbook: "Entry", construction: "Site", counter: "Hits", webring: "Link", divider: "HR" };
  const stills = new Map();
  function still(b, cls) {
    let c = stills.get(b.id);
    if (!c) {
      c = document.createElement("canvas"); c.width = 88; c.height = 31; stills.set(b.id, c);
      const im = new Image(); im.onload = () => c.getContext("2d").drawImage(im, 0, 0, 88, 31); im.src = b.image;
    }
    c.className = cls; return c;
  }
  const mk = (tag, cls, text) => { const e = document.createElement(tag); e.className = cls; if (text != null) e.textContent = text; return e; };
  // power/life left: power in green when Webcounter has raised it; life in red when the button has taken damage, else green when Glow raises it
  function ptText(b) {
    const p = mk("span", b.boost ? "up" : "", String(b.power)),
      l = mk("span", b.damage ? "hurt" : b.bonus ? "up" : "", String(b.toughness + (b.bonus ?? 0) - b.damage));
    return [p, "/", l];
  }
  function card(b, moving) {
    const gc = mk("div", "gc"), inn = mk("div", "gc-in"), name = mk("div", "gc-name", b.name), art = mk("div", "gc-art"), img = mk("img");
    name.style.fontSize = `calc(${Math.min(8.5, 102 / b.name.length).toFixed(1)} * var(--u))`;
    img.alt = ""; img.src = b.image; art.append(moving ? img : still(b, ""));
    const txt = mk("div", "gc-txt"), t = TEXT[b.type];
    if (t) { const k = mk("b", "", t[0]); txt.append(k, ` — ${t[1]}`); }
    const type = mk("div", "gc-type"), sym = mk("span", `sym ${b.rarity ?? "common"}`);
    sym.title = b.rarity ?? "common";
    type.append(mk("span", "", `${b.type[0].toUpperCase()}${b.type.slice(1)}${SUB[b.type] ? ` — ${SUB[b.type]}` : ""}`), sym);
    inn.append(name, art, type, txt);
    if (!b.out) { const pt = mk("span", "pt"); pt.append(...ptText(b)); inn.append(pt); }
    gc.append(inn); return gc;
  }
  function row(el, buttons, how) {
    el.innerHTML = "";
    buttons.forEach((b, i) => {
      const h = how(b, i);
      const wrap = document.createElement("div");
      const btn = document.createElement("button");
      btn.className = "btn" + (b.out ? " out" : "") + (b.tapped || h.tapped ? " tapped" : "") + (h.can ? " can" : "") + (h.sel ? " sel" : "") + (h.att ? " att" : "");
      btn.append(card(b, !b.out && (b.tapped || h.tapped)));
      if (h.click) btn.onclick = h.click;
      if (h.note) { const d = document.createElement("span"); d.className = "dmg"; d.textContent = h.note; btn.append(d); }
      btn.title = b.sick ? `${b.name}: came in this turn, can't ping` : b.name;
      btn.dataset.i = i;
      wrap.append(btn); el.append(wrap);
    });
  }
}
</script>
</body>
</html>
