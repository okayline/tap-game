<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tap</title>
<style>
  body { background: #c0c0c0; color: #000; font: 14px/1.4 monospace; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  a { color: #00e; }
  .side { background: #fff; border: 2px inset #808080; padding: 8px; margin: 8px 0; max-width: 420px; }
  .row { display: flex; gap: 12px; align-items: center; min-height: 96px; }
  .btn { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; }
  /* untapped (ready): stands vertical and greyed out; tapped (used): turns sideways into the normal, lit button */
  .btn img { width: 88px; height: 31px; image-rendering: pixelated; transition: transform .2s, filter .2s; transform: rotate(90deg); filter: grayscale(1) brightness(.8); }
  .btn.tapped img { transform: none; filter: none; }
  .btn.can { cursor: pointer; outline: 2px dashed #00e; }
  .name { font-size: 11px; text-align: center; width: 88px; }
  .bar { margin: 8px 0; }
  button.act { font: inherit; padding: 4px 10px; }
  #log { white-space: pre; font-size: 12px; max-height: 160px; overflow: auto; background: #fff; border: 2px inset #808080; padding: 6px; max-width: 420px; }
  .err { color: #a00; }
</style>
</head>
<body>
<h1>tap</h1>
<div id="game">
  <div class="side"><div id="themHp"></div><div class="row" id="them"></div></div>
  <div class="bar"><span id="status"></span> <span id="timer"></span> <span id="err" class="err"></span></div>
  <div class="bar"><button class="act" id="take" hidden>take the hit</button> <button class="act" id="end" hidden>end turn</button></div>
  <div class="side"><div id="meHp"></div><div class="row" id="me"></div></div>
  <div id="log"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
{
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname}/ws`);
  let g = null;
  const send = (o) => ws.send(JSON.stringify(o));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error) { $("err").textContent = d.error; return; }
    g = d.g; $("err").textContent = ""; draw();
  };
  ws.onclose = () => { $("status").textContent = "disconnected: reload"; };
  $("take").onclick = () => send({ do: "take" });
  $("end").onclick = () => send({ do: "end" });

  function draw() {
    const me = "a", them = "b";
    const blocking = g.pending && g.pending.by === them;
    const myTurn = g.turn === me && !g.pending && !g.winner;
    row($("me"), g.sides[me].buttons, (b) => !b.tapped && (myTurn || blocking), (i) => send({ do: blocking ? "block" : "hit", i }));
    row($("them"), g.sides[them].buttons, () => false);
    $("meHp").textContent = `you · hp ${g.sides[me].hp}`;
    $("themHp").textContent = `dummy · hp ${g.sides[them].hp}`;
    $("status").textContent = g.winner ? (g.winner === me ? "you win" : "you lose")
      : blocking ? "they hit: click a ready button to block" : g.pending ? "waiting for their block" : g.turn === me ? "your turn: click a ready button to hit" : "their turn";
    $("take").hidden = !blocking;
    $("end").hidden = !myTurn;
    $("log").textContent = g.log.slice(-30).join("\n");
    $("log").scrollTop = 1e9;
  }
  function row(el, buttons, can, click) {
    el.innerHTML = "";
    buttons.forEach((b, i) => {
      const wrap = document.createElement("div");
      const btn = document.createElement("button");
      btn.className = "btn" + (b.tapped ? " tapped" : "") + (can(b) ? " can" : "");
      const img = document.createElement("img"); img.alt = ""; img.src = b.image; btn.append(img);
      if (can(b)) btn.onclick = () => click(i);
      const n = document.createElement("div"); n.className = "name"; n.textContent = `${b.name} · ${b.type}`;
      wrap.append(btn, n); el.append(wrap);
    });
  }
  setInterval(() => {
    $("timer").textContent = g && g.pending && g.pending.until ? Math.max(0, Math.ceil((g.pending.until - Date.now()) / 1000)) + "s" : "";
  }, 200);
}
</script>
</body>
</html>
