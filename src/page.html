<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tap</title>
<style>
  /* themed like aura-farm ("Aura glow"): near-black with purple light, Impact headings, glowing text, gradient buttons */
  :root {
    --bg: #0b0a12; --panel: #171226; --panel2: #1b1530; --line: #3a2f5c;
    --ink: #f4f1ff; --mute: #c9b8ff; --dim: #a99ccf;
    --D: #5ad1ff; --H: #ff6fcf; --S: #b084ff;
    --meme: Impact, "Arial Black", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { min-height: 100vh; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(circle at 50% 0%, #2a1650 0%, var(--bg) 60%) fixed, var(--bg); }
  #game { max-width: 430px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-family: var(--meme); font-size: 26px; letter-spacing: .5px; text-transform: uppercase; margin: 0;
       text-shadow: 0 0 8px rgba(176,132,255,.6), 0 0 16px rgba(255,111,207,.3); }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .side > div:first-child { font-family: var(--meme); font-size: 18px; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 0 10px rgba(176,132,255,.75); }
  .row { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; min-height: 112px; margin-top: 8px; }
  .btn { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; border-radius: 10px; color: var(--ink); }
  /* untapped (ready, can block): lies flat and greyed out; tapped (attacking): stands up sideways and lights up in colour */
  .btn img { width: 88px; height: 31px; image-rendering: pixelated; transition: transform .2s, filter .2s; filter: grayscale(1) brightness(.6); }
  .btn.tapped img { transform: rotate(90deg); filter: drop-shadow(0 0 8px rgba(255,111,207,.8)); }
  .btn.can { cursor: pointer; outline: 2px dashed var(--S); outline-offset: 2px; }
  .btn.sel { outline: 2px solid var(--H); box-shadow: 0 0 16px rgba(255,111,207,.6); }
  .btn.att { outline: 2px solid var(--D); box-shadow: 0 0 16px rgba(90,209,255,.6); }
  .out { opacity: .25; }
  .name { font-size: 11px; text-align: center; width: 88px; color: var(--mute); margin-top: 4px; }
  .bar { text-align: center; }
  #status { font-weight: 700; text-shadow: 0 0 10px rgba(176,132,255,.75); }
  #timer { font-family: var(--meme); font-size: 18px; color: var(--H); text-shadow: 0 0 8px var(--H); }
  button.act { width: 100%; height: 54px; border-radius: 14px; border: 0; cursor: pointer; color: var(--ink);
               background: linear-gradient(135deg, #b084ff, #ff6fcf); font-family: var(--meme); font-size: 19px; letter-spacing: .5px;
               text-transform: uppercase; text-shadow: 0 0 6px rgba(255,255,255,.35); box-shadow: 0 0 22px rgba(255,111,207,.45); }
  #log { white-space: pre; font-size: 12px; max-height: 160px; overflow: auto; background: var(--panel); border: 1px solid var(--line);
         border-radius: 14px; padding: 10px 12px; color: var(--dim); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .err { color: #ffb3b3; }
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
</style>
</head>
<body>
<div id="game">
<h1>tap</h1>
  <div class="side"><div id="themHp"></div><div class="row" id="them"></div></div>
  <div class="bar"><span id="status"></span> <span id="timer"></span> <span id="err" class="err"></span></div>
  <div class="bar"><button class="act" id="attack" hidden>attack</button> <button class="act" id="block" hidden>block</button></div>
  <div class="side"><div id="meHp"></div><div class="row" id="me"></div></div>
  <div id="log"></div>
  <!-- the footer every game shows (dungeon-items src/footer.js), with this game's version: raise data-version every version; data-copy="no" leaves out the 🄯 (the buttons include remixes of other people's art, uncredited here) -->
  <div id="ddfoot"></div>
</div>
<script src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.9" data-copy="no"></script>
<script>
const $ = (id) => document.getElementById(id);
{
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${location.pathname}/ws`);
  let g = null;
  const send = (o) => ws.send(JSON.stringify(o));
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.error) { $("err").textContent = d.error; return; }
    g = d.g; $("err").textContent = ""; draw();
  };
  ws.onclose = () => { $("status").textContent = "disconnected: reload"; };
  let picked = new Set(), blocks = {}, chosen = null, seen = "";
  $("attack").onclick = () => send({ do: "attack", idxs: [...picked] });
  $("block").onclick = () => send({ do: "block", blocks });

  function draw() {
    const me = "a", them = "b", mine = g.sides[me].buttons, theirs = g.sides[them].buttons;
    const key = `${g.turn}|${g.attack ? g.attack.by : ""}|${g.log.length}`;
    if (key !== seen) { seen = key; picked = new Set(); blocks = {}; chosen = null; } // a new step: clear picks
    const blocking = g.attack && g.attack.by === them && !g.winner;
    const myTurn = g.turn === me && !g.attack && !g.winner;
    const ready = (b) => !b.out && !b.tapped;
    // your row: on your turn click to pick attackers (they show tapped); when blocking click a button, then an attacker
    row($("me"), mine, (b, i) => {
      if (myTurn && ready(b)) return { can: true, tapped: picked.has(i), click: () => { picked.has(i) ? picked.delete(i) : picked.add(i); draw(); } };
      if (blocking && ready(b)) {
        const on = blocks[i];
        return { can: true, sel: chosen === i, note: on !== undefined ? `blocks ${theirs[on].name}` : "",
          click: () => { if (on !== undefined) delete blocks[i]; else chosen = chosen === i ? null : i; draw(); } };
      }
      return {};
    });
    row($("them"), theirs, (b, i) => {
      const att = blocking && g.attack.attackers.includes(i);
      return att ? { att: true, can: chosen !== null, click: () => { if (chosen !== null) { blocks[chosen] = i; chosen = null; draw(); } } } : {};
    });
    $("meHp").textContent = `you · hp ${g.sides[me].hp}`;
    $("themHp").textContent = `dummy · hp ${g.sides[them].hp}`;
    $("status").textContent = g.winner ? (g.winner === me ? "you win (reload the main page for a new match)" : "you lose (reload the main page for a new match)")
      : blocking ? "they attack: click your button, then the attacker it blocks; then block"
      : myTurn ? "your turn: click buttons to tap them, then attack (none = pass)" : "their turn";
    $("attack").hidden = !myTurn;
    $("block").hidden = !blocking;
    $("log").textContent = g.log.slice(-30).join("\n");
    $("log").scrollTop = 1e9;
  }
  function row(el, buttons, how) {
    el.innerHTML = "";
    buttons.forEach((b, i) => {
      const h = how(b, i);
      const wrap = document.createElement("div");
      if (b.out) wrap.className = "out";
      const btn = document.createElement("button");
      btn.className = "btn" + (b.tapped || h.tapped ? " tapped" : "") + (h.can ? " can" : "") + (h.sel ? " sel" : "") + (h.att ? " att" : "");
      const img = document.createElement("img"); img.alt = ""; img.src = b.image; btn.append(img);
      if (h.click) btn.onclick = h.click;
      const n = document.createElement("div"); n.className = "name";
      n.textContent = `${b.name} · ${b.type} ${b.power}/${b.toughness}${b.out ? " · out" : ""}${h.note ? " · " + h.note : ""}`;
      wrap.append(btn, n); el.append(wrap);
    });
  }
  setInterval(() => {
    $("timer").textContent = g && g.attack && g.attack.until ? Math.max(0, Math.ceil((g.attack.until - Date.now()) / 1000)) + "s" : "";
  }, 200);
}
</script>
</body>
</html>
